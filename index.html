<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GAMING HUB</h1>
        <p>Sélectionne un portail pour lancer ton site</p>

    <main class="grid-container">
        <!-- Site 1 -->
        <a href="https://LIEN_VERS_SITE_1.com" target="_blank" class="card" style="--accent-color: #00d2ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo1.png" alt="Logo Supercell">
                </div>
                <span>Supercell & Jeux</span>
            </div>
        </a>

        <!-- Site 2 -->
        <a href="https://LIEN_VERS_SITE_2.com" target="_blank" class="card" style="--accent-color: #ff007f;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo2.png" alt="Logo Vidéo">
                </div>
                <span>Lecteur Média</span>
            </div>
        </a>

        <!-- Site 3 -->
        <a href="https://LIEN_VERS_SITE_3.com" target="_blank" class="card" style="--accent-color: #7f00ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo3.png" alt="Logo Interface">
                </div>
                <span>Dashboard / Outils</span>
            </div>
        </a>

        <!-- Site 4 -->
        <a href="https://LIEN_VERS_SITE_4.com" target="_blank" class="card" style="--accent-color: #00ffcc;">

                </div>

            </div>
        </a>

        <!-- Site 5 -->
        <a href="https://LIEN_VERS_SITE_5.com" target="_blank" class="card" style="--accent-color: #ff3333;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo5.png" alt="Logo Pokédex">
                </div>
                <span>Pokédex / Collection</span>
            </div>

        <!-- Site 6 -->
        <a href="https://LIEN_VERS_SITE_6.com" target="_blank" class="card" style="--accent-color: #ffa500;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo6.png" alt="Logo Paramètres">

            </div>

        <a href="https://LIEN_VERS_SITE_7.com" target="_blank" class="card" style="--accent-color: #00ff88;">

                    <img src="images/logo7.png" alt="Logo Studio Vidéo">

            </div>
        </a>

        <!-- Site 8 -->
        <a href="https://LIEN_VERS_SITE_8.com" target="_blank" class="card" style="--accent-color: #9900ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="images/logo8.png" alt="Logo Steam Art">
                </div>
                <span>Gaming Hub (Steam)</span>
            </div>
        </a>

    <footer>
        <p>&copy; 2026 - Gaming Hub Personnel</p>
    </footer>

</body>
</html>
