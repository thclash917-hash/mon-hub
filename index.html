<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Gaming Hub</title>
    <style>
        /* Style global : Fond bleu style gaming / cyberpunk */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0a192f 0%, #030712 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            overflow-x: hidden;
        }

        /* Effet de grille en arrière-plan style gaming */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        header {
            text-align: center;
            margin: 40px 20px 20px 20px;
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
        }

        header p {
            color: #8892b0;
            font-size: 1.1rem;
        }

        /* Grille des 8 sites */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 35px;
            width: 90%;
            max-width: 1200px;
            padding: 20px 0;
            flex: 1;
        }

        /* Carte interactive 3D */
        .card {
            perspective: 1000px;
            text-decoration: none;
            display: block;
        }

        .card-inner {
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        box-shadow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.4s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 30px var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Conteneur 3D pour le logo */
        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            perspective: 800px;
            transform-style: preserve-3d;
        }

        /* Animation 3D de rotation continue sur eux-mêmes */
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0, 210, 255, 0.4));
            animation: rotateLogo 8s infinite linear;
            transform-style: preserve-3d;
        }

        @keyframes rotateLogo {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        /* Accélération de la rotation au survol de la souris */
        .card:hover .logo-container img {
            animation-duration: 2s;
            filter: drop-shadow(0 0 20px var(--accent-color));
        }

        /* Texte de la carte */
        .card-inner span {
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e6f1ff;
            transition: color 0.3s ease;
        }

        .card:hover .card-inner span {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8892b0;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>GAMING HUB</h1>
        <p>Sélectionne un portail pour lancer ton site</p>
    </header>

    <main class="grid-container">
        <!-- Site 1 -->
        <a href="https://shop-fire-zeta.vercel.app/" target="_blank" class="card" style="--accent-color: #00d2ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo1.png" alt="Logo Supercell">
                </div>
                <span>Supercell & Jeux</span>
            </div>
        </a>

        <!-- Site 2 -->
        <a href="https://edit-video-ia.lovable.app/" target="_blank" class="card" style="--accent-color: #ff007f;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo2.png" alt="Logo Vidéo">
                </div>
                <span>Lecteur Média</span>
            </div>
        </a>

        <!-- Site 3 -->
        <a href="https://convertionfacile.lovable.app/" target="_blank" class="card" style="--accent-color: #7f00ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo3.png" alt="Logo Interface">
                </div>
                <span>Dashboard / Outils</span>
            </div>
        </a>

        <!-- Site 4 -->
        <a href="https://thclash917-hash.github.io/Tracking-Twitch-Steam/" target="_blank" class="card" style="--accent-color: #00ffcc;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo4.png" alt="Logo Musique">
                </div>
                <span>Espace Musical</span>
            </div>
        </a>

        <!-- Site 5 -->
        <a href="https://verbose-vet.lovable.app/" target="_blank" class="card" style="--accent-color: #ff3333;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo5.png" alt="Logo Pokédex">
                </div>
                <span>Pokédex / Collection</span>
            </div>
        </a>

        <!-- Site 6 -->
        <a href="https://subtitled-shorts-studio.lovable.app/" target="_blank" class="card" style="--accent-color: #ffa500;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo6.png" alt="Logo Paramètres">
                </div>
                <span>Configuration</span>
            </div>
        </a>

        <!-- Site 7 -->
        <a href="https://freemusiclink.lovable.app/" target="_blank" class="card" style="--accent-color: #00ff88;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo7.png" alt="Logo Studio Vidéo">
                </div>
                <span>Édition Vidéo</span>
            </div>
        </a>

        <!-- Site 8 -->
        <a href="https://dexnational.lovable.app/" target="_blank" class="card" style="--accent-color: #9900ff;">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="logo8.png" alt="Logo Steam Art">
                </div>
                <span>Gaming Hub (Steam)</span>
            </div>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 - Gaming Hub Personnel</p>
    </footer>

</body>
</html>
